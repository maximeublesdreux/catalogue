<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<title>Maxi Meubles</title>
<meta name="theme-color" content="#ffffff">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icons/icon-192.png">
<link href="https://fonts.googleapis.com/css2?family=Jost:wght@300;400;500&display=swap" rel="stylesheet">
<style>
:root{--bg:#fff;--ink:#141414;--acc:#ce0964;--acc-soft:#fbe9f1;--mute:#8a8580;--line:#ececea;--soft:#f6f5f3;--red:#c0392b;color-scheme:light}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;-webkit-user-select:none;user-select:none}
input,textarea{-webkit-user-select:text;user-select:text}
html{scroll-behavior:smooth}
body{margin:0;background:var(--bg);color:var(--ink);font:400 17px/1.5 'Jost',system-ui,sans-serif;-webkit-font-smoothing:antialiased;overscroll-behavior-y:contain}
button,input,select,textarea{font:inherit;color:inherit}
button{background:none;border:0;cursor:pointer;padding:0}
[hidden]{display:none!important}
.wrap{max-width:1400px;margin:0 auto;padding:0 clamp(20px,3.5vw,48px)}

header{position:sticky;top:0;z-index:20;background:rgba(255,255,255,.94);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);border-bottom:1px solid var(--line)}
.bar{display:flex;align-items:center;gap:20px;height:72px}
.brand{height:46px;width:auto;display:block}
@media(max-width:600px){.brand{height:36px}}
.search{margin-left:auto;width:min(320px,40vw);border:1px solid var(--line);border-radius:999px;padding:10px 18px;font-size:16px;outline:none;background:#fff}
.search:focus{border-color:var(--acc)}
.lock{width:44px;height:44px;border-radius:50%;color:#d6d3cf;font-size:20px;letter-spacing:1px}

.editbar{background:var(--ink);color:#fff}
.editbar .wrap{display:flex;align-items:center;gap:10px;height:58px}
.editbar span{flex:1;font-size:15px;letter-spacing:.04em}
.editbar button{border:1px solid rgba(255,255,255,.4);border-radius:999px;padding:8px 18px;font-size:15px}
.editbar button.w{background:#fff;color:var(--ink);border-color:#fff}

.hero{padding:clamp(40px,7vw,90px) 0 clamp(26px,4vw,44px)}
.hero h1{font-weight:300;font-size:clamp(34px,5.5vw,60px);line-height:1.08;margin:0;max-width:16ch}
.hero h1::after{content:"";display:block;width:56px;height:3px;background:var(--acc);margin-top:26px}

.cats{display:flex;gap:10px;overflow-x:auto;scrollbar-width:none;padding:4px 0 26px;position:sticky;top:72px;background:var(--bg);z-index:10}
.cats::-webkit-scrollbar{display:none}
.cats button{flex:0 0 auto;padding:11px 22px;border:1px solid var(--line);border-radius:999px;font-size:16px;color:var(--mute);white-space:nowrap}
.cats button[aria-pressed="true"]{background:var(--acc);border-color:var(--acc);color:#fff}

.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:36px 24px;padding-bottom:100px}
@media(max-width:600px){.grid{grid-template-columns:1fr 1fr;gap:24px 12px}}
.card{text-align:left;display:block;width:100%;position:relative}
.ph{aspect-ratio:4/5;background:var(--soft);overflow:hidden;position:relative}
.ph img{width:100%;height:100%;object-fit:cover;display:block}
.tag{position:absolute;top:10px;left:10px;background:#fff;color:var(--acc);font-weight:500;font-size:11px;letter-spacing:.12em;text-transform:uppercase;padding:4px 9px}
.tag.promo{background:var(--acc);color:#fff}
.price.promo{color:var(--acc)}
.hid{position:absolute;inset:0;background:rgba(255,255,255,.65);display:grid;place-items:center;font-size:13px;letter-spacing:.12em;text-transform:uppercase}
.pen{position:absolute;top:10px;right:10px;width:40px;height:40px;border-radius:50%;background:#fff;display:grid;place-items:center;font-size:17px;box-shadow:0 2px 8px rgba(0,0,0,.1)}
.meta{display:flex;justify-content:space-between;gap:10px;margin-top:12px;align-items:baseline}
.meta .n{font-size:16px}
.meta .c{font-size:12px;color:var(--mute);letter-spacing:.06em;text-transform:uppercase;margin-top:2px}
.price{white-space:nowrap}
.price s{color:var(--mute);font-size:.85em;margin-right:6px}
.empty{grid-column:1/-1;color:var(--mute);padding:70px 0;text-align:center}
.empty .btn{display:inline-block;width:auto;margin:16px 6px 0;padding:14px 26px}

/* dialogs */
dialog{border:0;padding:0;background:var(--bg);color:var(--ink)}
dialog::backdrop{background:rgba(0,0,0,.35)}
dialog[open]{animation:in .22s ease}
@keyframes in{from{opacity:0;transform:translateY(10px)}}
.full{margin:0;width:100%;max-width:100%;height:100%;max-height:100%}
.close{position:fixed;top:calc(16px + env(safe-area-inset-top));right:16px;z-index:5;width:52px;height:52px;border-radius:50%;background:#fff;box-shadow:0 2px 14px rgba(0,0,0,.1);font-size:26px;display:grid;place-items:center}

.sheet{display:grid;grid-template-columns:1.25fr 1fr;height:100%}
@media(max-width:820px) and (orientation:portrait){.sheet{grid-template-columns:1fr;grid-template-rows:62% 1fr}}
.gal{position:relative;background:var(--soft);min-height:0;overflow:hidden}
.track{display:flex;overflow-x:auto;scroll-snap-type:x mandatory;height:100%;scrollbar-width:none}
.track::-webkit-scrollbar{display:none}
.track img{flex:0 0 100%;width:100%;height:100%;object-fit:cover;scroll-snap-align:center}
.dots{position:absolute;bottom:18px;left:0;right:0;display:flex;justify-content:center;gap:8px}
.dots i{width:8px;height:8px;border-radius:50%;background:rgba(255,255,255,.55);box-shadow:0 0 3px rgba(0,0,0,.2)}
.dots i.on{background:#fff}
.arr{position:absolute;top:50%;transform:translateY(-50%);width:52px;height:52px;border-radius:50%;background:rgba(255,255,255,.88);display:grid;place-items:center;font-size:24px}
.arr.l{left:16px}.arr.r{right:16px}
.det{padding:clamp(28px,4.5vw,64px);display:flex;flex-direction:column;gap:18px;overflow-y:auto}
.det .c{font-size:13px;color:var(--acc);letter-spacing:.16em;text-transform:uppercase}
.det h2{font-weight:300;font-size:clamp(30px,4vw,44px);line-height:1.1;margin:0}
.det .price{font-size:26px}
.det .d{color:#4a4743;white-space:pre-line;margin:0;font-size:18px}
.attrs{display:flex;flex-wrap:wrap;gap:8px}
.attrs span{font-size:14px;border:1px solid var(--line);padding:6px 14px;border-radius:999px;color:var(--mute)}

/* forms */
.form{padding:calc(20px + env(safe-area-inset-top)) clamp(20px,4vw,40px) 40px;max-width:720px;margin:0 auto}
.form h2{font-weight:400;font-size:26px;margin:6px 0 10px}
label{display:block;font-size:14px;color:var(--mute);margin:18px 0 6px}
.form input,.form select,.form textarea,.pin input{width:100%;border:1px solid var(--line);border-radius:10px;padding:14px;background:#fff;font-size:17px;outline:none}
.form input:focus,.form select:focus,.form textarea:focus{border-color:var(--ink)}
.form textarea{min-height:120px;resize:vertical}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.btn{display:block;width:100%;padding:16px;border-radius:12px;border:1px solid var(--ink);text-align:center;font-size:17px;font-weight:500}
.btn.dark{background:var(--acc);border-color:var(--acc);color:#fff}
.btn.danger{border-color:var(--red);color:var(--red)}
.stack>*+*{margin-top:12px}
.muted{color:var(--mute);font-size:14px}
.photos{display:flex;gap:10px;overflow-x:auto;padding:4px 0 6px}
.photo{position:relative;flex:0 0 auto;width:120px;height:144px;border-radius:10px;overflow:hidden;background:var(--soft)}
.photo img{width:100%;height:100%;object-fit:cover}
.photo .x,.photo .mv{position:absolute;width:34px;height:34px;border-radius:50%;background:rgba(255,255,255,.95);font-size:18px;line-height:34px}
.photo .x{top:6px;right:6px}.photo .mv{bottom:6px;left:6px}
.photo .main{position:absolute;bottom:0;left:0;right:0;font-size:12px;text-align:center;background:rgba(20,20,20,.75);color:#fff;padding:4px}
.addph{flex:0 0 auto;width:120px;height:144px;border-radius:10px;border:1.5px dashed #ccc;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;color:var(--mute);font-size:14px}
.addph b{font-size:32px;font-weight:300;line-height:1}
.switch{display:flex;align-items:center;justify-content:space-between;padding:16px 0;border-bottom:1px solid var(--line)}
.switch input{width:auto!important;transform:scale(1.5);accent-color:var(--acc)}
.catrow{display:flex;align-items:center;gap:10px;padding:10px 0;border-bottom:1px solid var(--line)}
.catrow span{flex:1}
.catrow button{width:42px;height:42px;border-radius:8px;border:1px solid var(--line)}
.catrow button:disabled{opacity:.3}
.sec{margin-top:34px;padding-top:6px;border-top:1px solid var(--line)}

.pin{width:min(380px,92vw);border-radius:18px;padding:28px}
.pin h3{margin:0 0 6px;font-weight:500;font-size:20px}
.pin input{font-size:26px;letter-spacing:.4em;text-align:center;margin:16px 0}
.pin .row2 .btn{padding:14px}

#toast{position:fixed;left:50%;bottom:40px;transform:translateX(-50%) translateY(20px);background:var(--ink);color:#fff;padding:13px 22px;border-radius:999px;opacity:0;transition:all .25s;pointer-events:none;z-index:100;max-width:90vw;text-align:center}
#toast.show{opacity:1;transform:translateX(-50%)}
#busy{position:fixed;inset:0;background:rgba(255,255,255,.85);display:none;align-items:center;justify-content:center;flex-direction:column;gap:14px;z-index:90}
#busy.on{display:flex}
.spin{width:36px;height:36px;border:3px solid var(--line);border-top-color:var(--ink);border-radius:50%;animation:s .8s linear infinite}
@keyframes s{to{transform:rotate(360deg)}}
</style>
</head>
<body>
<div class="editbar" id="editbar" hidden>
  <div class="wrap"><span>Mode modification</span>
    <button id="bAdd" class="w">+ Ajouter</button><button id="bSet">Réglages</button><button id="bDone">Terminer</button></div>
</div>
<header>
  <div class="wrap bar">
    <img class="brand" id="brand" src="icons/logo.png" alt="Maxi Meubles">
    <input class="search" id="q" type="search" placeholder="Rechercher" autocomplete="off">
    <button class="lock" id="lock" aria-label="Mode modification">•••</button>
  </div>
</header>

<main class="wrap">
  <section class="hero"><h1 id="tagline"></h1></section>
  <div class="cats" id="cats"></div>
  <div class="grid" id="grid"></div>
</main>

<!-- product sheet -->
<dialog id="sheet" class="full">
  <button class="close" data-close aria-label="Fermer">×</button>
  <div class="sheet">
    <div class="gal">
      <div class="track" id="track"></div>
      <button class="arr l" id="prev" aria-label="Photo précédente">‹</button>
      <button class="arr r" id="next" aria-label="Photo suivante">›</button>
      <div class="dots" id="dots"></div>
    </div>
    <div class="det" id="det"></div>
  </div>
</dialog>

<!-- editor -->
<dialog id="editor" class="full">
  <button class="close" data-close aria-label="Fermer">×</button>
  <div class="form">
    <h2 id="eTitle">Article</h2>
    <label>Photos <span class="muted">— la première est la photo principale</span></label>
    <div class="photos" id="ePhotos"></div>
    <input type="file" id="eFile" accept="image/*" multiple hidden>
    <label>Nom</label><input id="eName" placeholder="Ex. Canapé Toulouse">
    <label>Catégorie</label><select id="eCat"></select>
    <div class="row2">
      <div><label>Prix (€)</label><input id="ePrice" inputmode="decimal"></div>
      <div><label>Ancien prix (promo)</label><input id="eOld" inputmode="decimal" placeholder="facultatif"></div>
    </div>
    <label>Description</label><textarea id="eDesc" placeholder="Dimensions, matière, couleur…"></textarea>
    <div class="switch"><span>Badge « Nouveau »</span><input type="checkbox" id="eNew"></div>
    <div class="switch"><span>Masquer (rupture de stock…)</span><input type="checkbox" id="eHide"></div>
    <div class="stack" style="margin-top:26px">
      <button class="btn dark" id="eSave">Enregistrer</button>
      <button class="btn danger" id="eDel">Supprimer l'article</button>
    </div>
  </div>
</dialog>

<!-- settings -->
<dialog id="settings" class="full">
  <button class="close" data-close aria-label="Fermer">×</button>
  <div class="form">
    <h2>Réglages</h2>
    <label>Nom du magasin</label><input id="sName">
    <label>Phrase d'accueil</label><input id="sTag">
    <label>Catégories</label>
    <div id="sCats"></div>
    <div style="display:flex;gap:10px;margin-top:12px"><input id="sNewCat" placeholder="Nouvelle catégorie"><button class="btn" id="sAddCat" style="width:auto;padding:0 22px">Ajouter</button></div>
    <div class="stack" style="margin-top:24px"><button class="btn dark" id="sSave">Enregistrer</button></div>

    <div class="sec">
      <label>Sauvegarde</label>
      <p class="muted" style="margin:0 0 12px">Les articles sont enregistrés uniquement dans cette tablette. Fais une sauvegarde de temps en temps et garde le fichier ailleurs (clé USB, ordinateur, e-mail).</p>
      <div class="stack">
        <button class="btn" id="sExport">Créer une sauvegarde</button>
        <button class="btn" id="sImport">Restaurer une sauvegarde…</button>
        <input type="file" id="sFile" accept=".json,application/json" hidden>
      </div>
    </div>
    <div class="sec">
      <label>Code d'accès</label>
      <div class="stack"><button class="btn" id="sPin">Changer le code</button></div>
    </div>
  </div>
</dialog>

<!-- pin -->
<dialog id="pin" class="pin">
  <h3 id="pTitle">Code</h3><div class="muted" id="pSub"></div>
  <input id="pIn" type="password" inputmode="numeric" pattern="[0-9]*" maxlength="8" autocomplete="off">
  <div class="row2"><button class="btn" id="pNo">Annuler</button><button class="btn dark" id="pOk">Valider</button></div>
</dialog>

<div id="busy"><div class="spin"></div><div id="busyMsg"></div></div>
<div id="toast"></div>

<script>
const $ = s => document.querySelector(s);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const uid = () => Date.now().toString(36) + Math.random().toString(36).slice(2, 6);
const euro = v => { const n = Number(String(v ?? '').replace(',', '.')); return String(v ?? '').trim() !== '' && isFinite(n) ? n.toLocaleString('fr-FR', Number.isInteger(n) ? {} : {minimumFractionDigits: 2, maximumFractionDigits: 2}) + ' €' : ''; };
function toast(m){ const t = $('#toast'); t.textContent = m; t.classList.add('show'); clearTimeout(t._h); t._h = setTimeout(() => t.classList.remove('show'), 2800); }
function busy(on, m = ''){ $('#busy').classList.toggle('on', on); $('#busyMsg').textContent = m; }

/* ---------- storage (IndexedDB, stays on this tablet) ---------- */
const DB = {
  p: null,
  open(){ return this.p ||= new Promise((ok, ko) => {
    const r = indexedDB.open('maxi-meubles', 1);
    r.onupgradeneeded = () => { const d = r.result; d.createObjectStore('items', {keyPath: 'id'}); d.createObjectStore('photos'); d.createObjectStore('meta'); };
    r.onsuccess = () => ok(r.result); r.onerror = () => ko(r.error);
  }); },
  async run(store, mode, fn){
    const d = await this.open();
    return new Promise((ok, ko) => {
      const t = d.transaction(store, mode), req = fn(t.objectStore(store));
      t.oncomplete = () => ok(req && req.result); t.onerror = t.onabort = () => ko(t.error || new Error('Stockage plein ?'));
    });
  },
  all: (s) => DB.run(s, 'readonly', o => o.getAll()),
  keys: (s) => DB.run(s, 'readonly', o => o.getAllKeys()),
  get: (s, k) => DB.run(s, 'readonly', o => o.get(k)),
  put: (s, v, k) => DB.run(s, 'readwrite', o => o.put(v, k)),
  del: (s, k) => DB.run(s, 'readwrite', o => o.delete(k)),
  clear: (s) => DB.run(s, 'readwrite', o => o.clear())
};

let items = [], meta = {name: 'Maxi Meubles', tagline: 'Meubles, literie et canapés', cats: ['Canapés', 'Lits', 'Matelas', 'Chaises', 'Tables', 'Meubles TV']};
let editing = false, cat = 'Tout';
const urls = {};   // photoId -> object URL
const purl = id => { if (!urls[id]) return ''; return urls[id]; };

async function loadAll(){
  const m = await DB.get('meta', 'settings'); if (m) meta = {...meta, ...m};
  items = await DB.all('items');
  for (const k of Object.keys(urls)){ URL.revokeObjectURL(urls[k]); delete urls[k]; }
  const keys = await DB.keys('photos');
  for (const k of keys){ const b = await DB.get('photos', k); if (b) urls[k] = URL.createObjectURL(b); }
  sortItems();
}
const sortItems = () => items.sort((a, b) => (a.order ?? 0) - (b.order ?? 0));
const saveMeta = () => DB.put('meta', {name: meta.name, tagline: meta.tagline, cats: meta.cats, pin: meta.pin}, 'settings');

/* ---------- display ---------- */
function shown(){
  const q = $('#q').value.trim().toLowerCase();
  return items.filter(it => (editing || !it.hidden) && (cat === 'Tout' || it.cat === cat)
    && (!q || (it.name + ' ' + (it.desc || '') + ' ' + it.cat).toLowerCase().includes(q)));
}
function priceHTML(it){ const p = euro(it.price), o = euro(it.oldPrice); return p ? (o ? `<s>${o}</s>` : '') + p : ''; }
function render(){
  $('#brand').alt = meta.name; document.title = meta.name; $('#tagline').textContent = meta.tagline;
  const used = new Set(items.filter(i => editing || !i.hidden).map(i => i.cat));
  const list = ['Tout', ...meta.cats.filter(c => editing || used.has(c))];
  if (!list.includes(cat)) cat = 'Tout';
  $('#cats').innerHTML = list.map(c => `<button aria-pressed="${c === cat}" data-c="${esc(c)}">${esc(c)}</button>`).join('');
  const arr = shown();
  if (!items.length){
    $('#grid').innerHTML = `<div class="empty">Aucun article pour le moment.<br>
      <button class="btn dark" onclick="startEdit(()=>openEditor(null))">Ajouter un article</button>
      <button class="btn" onclick="startEdit(()=>$('#sFile').click())">Restaurer une sauvegarde</button></div>`;
    return;
  }
  $('#grid').innerHTML = arr.length ? arr.map(it => {
    const ph = (it.photos || [])[0];
    return `<button class="card" data-id="${esc(it.id)}">
      <div class="ph">${ph ? `<img loading="lazy" src="${purl(ph)}" alt="">` : ''}
        ${it.oldPrice ? '<span class="tag promo">Promo</span>' : it.isNew ? '<span class="tag">Nouveau</span>' : ''}
        ${editing && it.hidden ? '<div class="hid">Masqué</div>' : ''}
        ${editing ? '<span class="pen">✎</span>' : ''}</div>
      <div class="meta"><div><div class="n">${esc(it.name)}</div><div class="c">${esc(it.cat)}</div></div><div class="price${it.oldPrice ? ' promo' : ''}">${priceHTML(it)}</div></div>
    </button>`;
  }).join('') : '<p class="empty">Aucun article ici.</p>';
}
$('#cats').onclick = e => { const b = e.target.closest('button'); if (!b) return; cat = b.dataset.c; render(); };
$('#q').oninput = render;
$('#grid').onclick = e => { const b = e.target.closest('.card'); if (!b) return; editing ? openEditor(b.dataset.id) : openSheet(b.dataset.id); };
document.querySelectorAll('[data-close]').forEach(b => b.onclick = () => b.closest('dialog').close());

/* product sheet */
let cur = null, idx = 0;
function openSheet(id){
  const it = items.find(i => i.id === id); if (!it) return;
  cur = it; idx = 0;
  const ph = it.photos || [];
  $('#track').innerHTML = ph.map(p => `<img src="${purl(p)}" alt="">`).join('');
  $('#dots').innerHTML = ph.length > 1 ? ph.map((_, i) => `<i class="${i ? '' : 'on'}"></i>`).join('') : '';
  $('#prev').hidden = $('#next').hidden = ph.length < 2;
  const attrs = Object.values(it.attrs || {}).filter(Boolean);
  $('#det').innerHTML = `<div class="c">${esc(it.cat)}</div><h2>${esc(it.name)}</h2><div class="price${it.oldPrice ? ' promo' : ''}">${priceHTML(it)}</div>
    ${it.desc ? `<p class="d">${esc(it.desc)}</p>` : ''}
    ${attrs.length ? `<div class="attrs">${attrs.map(a => `<span>${esc(a)}</span>`).join('')}</div>` : ''}`;
  $('#sheet').showModal(); $('#track').scrollLeft = 0;
}
function go(i){ const t = $('#track'); t.scrollTo({left: i * t.clientWidth, behavior: 'smooth'}); }
$('#track').addEventListener('scroll', () => { const t = $('#track'), i = Math.round(t.scrollLeft / t.clientWidth);
  if (i !== idx){ idx = i; [...$('#dots').children].forEach((d, k) => d.classList.toggle('on', k === i)); } }, {passive: true});
$('#prev').onclick = () => go(Math.max(0, idx - 1));
$('#next').onclick = () => go(Math.min((cur.photos || []).length - 1, idx + 1));

/* back to the start after 2 min without touch (customer walked away) */
let idleT;
function idle(){ clearTimeout(idleT); idleT = setTimeout(() => {
  if (editing) return;
  if ($('#sheet').open) $('#sheet').close();
  $('#q').value = ''; cat = 'Tout'; render(); window.scrollTo({top: 0});
}, 120000); }
['pointerdown', 'scroll', 'keydown'].forEach(ev => addEventListener(ev, idle, {passive: true, capture: true})); idle();

/* ---------- PIN / edit mode ---------- */
async function hash(s){ const b = await crypto.subtle.digest('SHA-256', new TextEncoder().encode('mm:' + s)); return [...new Uint8Array(b)].map(x => x.toString(16).padStart(2, '0')).join(''); }
function askPin(title, sub){
  return new Promise(ok => {
    $('#pTitle').textContent = title; $('#pSub').textContent = sub || ''; $('#pIn').value = '';
    const d = $('#pin'); d.showModal(); setTimeout(() => $('#pIn').focus(), 50);
    const done = v => { d.close(); $('#pOk').onclick = $('#pNo').onclick = null; d.onclose = null; ok(v); };
    $('#pOk').onclick = () => done($('#pIn').value.trim());
    $('#pNo').onclick = () => done(null);
    $('#pIn').onkeydown = e => { if (e.key === 'Enter') done($('#pIn').value.trim()); };
    d.onclose = () => ok(null);
  });
}
async function newPin(){
  const a = await askPin('Nouveau code', 'Choisis un code de 4 chiffres ou plus pour protéger le mode modification.');
  if (a == null) return false;
  if (!/^\d{4,8}$/.test(a)){ toast('Le code doit faire 4 à 8 chiffres'); return false; }
  const b = await askPin('Confirme le code');
  if (a !== b){ toast('Les codes ne correspondent pas'); return false; }
  meta.pin = await hash(a); await saveMeta(); toast('Code enregistré'); return true;
}
async function startEdit(then){
  if (!editing){
    if (!meta.pin){ if (!await newPin()) return; }
    else { const v = await askPin('Mode modification', 'Entre ton code'); if (v == null) return;
      if (await hash(v) !== meta.pin){ toast('Code incorrect'); return; } }
    editing = true; $('#editbar').hidden = false; render();
  }
  if (then) then();
}
$('#lock').onclick = () => startEdit();
$('#bDone').onclick = () => { editing = false; $('#editbar').hidden = true; render(); };
$('#bAdd').onclick = () => openEditor(null);

/* ---------- editor ---------- */
let ed = null;
function openEditor(id){
  const it = id ? items.find(i => i.id === id) : null;
  ed = {it, photos: (it?.photos || []).map(p => ({id: p, url: purl(p)})), removed: []};
  $('#eTitle').textContent = it ? 'Modifier l\'article' : 'Nouvel article';
  $('#eName').value = it?.name || '';
  $('#eCat').innerHTML = meta.cats.map(c => `<option>${esc(c)}</option>`).join('');
  $('#eCat').value = it ? it.cat : (cat !== 'Tout' ? cat : meta.cats[0] || '');
  $('#ePrice').value = it?.price || ''; $('#eOld').value = it?.oldPrice || ''; $('#eDesc').value = it?.desc || '';
  $('#eNew').checked = !!it?.isNew; $('#eHide').checked = !!it?.hidden; $('#eDel').hidden = !it;
  renderPhotos(); $('#editor').showModal(); $('#editor').scrollTop = 0;
}
function renderPhotos(){
  $('#ePhotos').innerHTML = ed.photos.map((p, i) => `<div class="photo"><img src="${p.url}" alt="">
    <button class="x" data-rm="${i}" aria-label="Retirer">×</button>
    ${i ? `<button class="mv" data-first="${i}" aria-label="Mettre en premier">★</button>` : '<div class="main">Principale</div>'}</div>`).join('')
    + '<button class="addph" id="addph"><b>+</b>Photo</button>';
}
$('#ePhotos').onclick = e => {
  const b = e.target.closest('button'); if (!b) return;
  if (b.id === 'addph') return $('#eFile').click();
  if (b.dataset.rm){ const [p] = ed.photos.splice(+b.dataset.rm, 1); if (p.blob) URL.revokeObjectURL(p.url); else ed.removed.push(p.id); }
  if (b.dataset.first){ const [p] = ed.photos.splice(+b.dataset.first, 1); ed.photos.unshift(p); }
  renderPhotos();
};
function shrink(file, max = 1600){
  return new Promise((ok, ko) => {
    const img = new Image(); img.onload = () => {
      const k = Math.min(1, max / Math.max(img.width, img.height));
      const c = document.createElement('canvas'); c.width = Math.round(img.width * k); c.height = Math.round(img.height * k);
      c.getContext('2d').drawImage(img, 0, 0, c.width, c.height); URL.revokeObjectURL(img.src);
      c.toBlob(b => b ? ok(b) : ko(new Error('Photo illisible')), 'image/jpeg', 0.82);
    };
    img.onerror = () => ko(new Error('Photo illisible')); img.src = URL.createObjectURL(file);
  });
}
$('#eFile').onchange = async e => {
  busy(true, 'Préparation des photos…');
  for (const f of e.target.files){ try { const blob = await shrink(f); ed.photos.push({id: 'p' + uid(), blob, url: URL.createObjectURL(blob)}); } catch (err){ toast(err.message); } }
  e.target.value = ''; busy(false); renderPhotos();
};
const num = v => v.trim().replace(/\s|€/g, '').replace(',', '.');
$('#eSave').onclick = async () => {
  const name = $('#eName').value.trim();
  if (!name) return toast('Ajoute un nom');
  if (!$('#eCat').value) return toast('Crée d\'abord une catégorie dans Réglages');
  busy(true, 'Enregistrement…');
  try {
    for (const p of ed.photos.filter(p => p.blob)){ await DB.put('photos', p.blob, p.id); urls[p.id] = p.url; delete p.blob; }
    const it = {...(ed.it || {id: uid(), order: Math.min(0, ...items.map(i => i.order ?? 0)) - 1}),
      name, cat: $('#eCat').value, price: num($('#ePrice').value), oldPrice: num($('#eOld').value),
      desc: $('#eDesc').value.trim(), isNew: $('#eNew').checked, hidden: $('#eHide').checked, photos: ed.photos.map(p => p.id)};
    await DB.put('items', it);
    for (const id of ed.removed){ await DB.del('photos', id); URL.revokeObjectURL(urls[id]); delete urls[id]; }
    if (ed.it) items[items.indexOf(ed.it)] = it; else items.push(it);
    sortItems(); $('#editor').close(); render(); toast('Enregistré ✓');
  } catch (e){ toast('Erreur : ' + e.message); }
  finally { busy(false); }
};
$('#eDel').onclick = async () => {
  if (!ed.it || !confirm(`Supprimer « ${ed.it.name} » ?`)) return;
  await DB.del('items', ed.it.id);
  for (const id of ed.it.photos || []){ await DB.del('photos', id); URL.revokeObjectURL(urls[id]); delete urls[id]; }
  items = items.filter(i => i !== ed.it); $('#editor').close(); render(); toast('Article supprimé');
};

/* ---------- settings ---------- */
let cats = [];
$('#bSet').onclick = () => { $('#sName').value = meta.name; $('#sTag').value = meta.tagline; cats = [...meta.cats]; renderCats(); $('#settings').showModal(); };
function renderCats(){
  $('#sCats').innerHTML = cats.map((c, i) => { const n = items.filter(it => it.cat === c).length;
    return `<div class="catrow"><span>${esc(c)} <span class="muted">· ${n}</span></span>
      <button data-up="${i}" ${i ? '' : 'disabled'} aria-label="Monter">↑</button>
      <button data-del="${i}" ${n ? 'disabled' : ''} aria-label="Supprimer">×</button></div>`; }).join('');
}
$('#sCats').onclick = e => { const b = e.target.closest('button'); if (!b || b.disabled) return;
  if (b.dataset.up){ const i = +b.dataset.up; [cats[i - 1], cats[i]] = [cats[i], cats[i - 1]]; }
  if (b.dataset.del) cats.splice(+b.dataset.del, 1); renderCats(); };
$('#sAddCat').onclick = () => { const v = $('#sNewCat').value.trim(); if (v && !cats.includes(v)){ cats.push(v); $('#sNewCat').value = ''; renderCats(); } };
$('#sSave').onclick = async () => { meta.name = $('#sName').value.trim() || 'Maxi Meubles'; meta.tagline = $('#sTag').value.trim(); meta.cats = [...cats];
  await saveMeta(); $('#settings').close(); render(); toast('Enregistré ✓'); };
$('#sPin').onclick = () => newPin();

/* backup: one .json file with articles + photos */
const toDataURL = b => new Promise(ok => { const r = new FileReader(); r.onload = () => ok(r.result); r.readAsDataURL(b); });
$('#sExport').onclick = async () => {
  busy(true, 'Création de la sauvegarde…');
  try {
    const photos = {};
    for (const it of items) for (const id of it.photos || []){ const b = await DB.get('photos', id); if (b) photos[id] = await toDataURL(b); }
    const out = {app: 'maxi-meubles', version: 1, date: new Date().toISOString(), name: meta.name, tagline: meta.tagline, cats: meta.cats, items, photos};
    const a = document.createElement('a'); a.href = URL.createObjectURL(new Blob([JSON.stringify(out)], {type: 'application/json'}));
    a.download = `maxi-meubles-sauvegarde-${new Date().toISOString().slice(0, 10)}.json`; a.click();
    setTimeout(() => URL.revokeObjectURL(a.href), 60000);
    toast('Sauvegarde enregistrée dans Téléchargements');
  } catch (e){ toast('Erreur : ' + e.message); }
  finally { busy(false); }
};
$('#sImport').onclick = () => $('#sFile').click();
$('#sFile').onchange = async e => {
  const f = e.target.files[0]; e.target.value = ''; if (!f) return;
  if (items.length && !confirm('Remplacer TOUS les articles de la tablette par ceux de la sauvegarde ?')) return;
  busy(true, 'Restauration…');
  try {
    const d = JSON.parse(await f.text());
    if (d.app !== 'maxi-meubles' || !Array.isArray(d.items)) throw new Error('Ce fichier n\'est pas une sauvegarde Maxi Meubles');
    await DB.clear('items'); await DB.clear('photos');
    let i = 0;
    for (const [id, data] of Object.entries(d.photos || {})){ busy(true, `Restauration des photos ${++i}/${Object.keys(d.photos).length}…`); await DB.put('photos', await (await fetch(data)).blob(), id); }
    for (const it of d.items) await DB.put('items', it);
    meta.name = d.name || meta.name; meta.tagline = d.tagline ?? meta.tagline; if (Array.isArray(d.cats) && d.cats.length) meta.cats = d.cats;
    await saveMeta(); await loadAll();
    if ($('#settings').open) $('#settings').close();
    cat = 'Tout'; render(); toast(`${items.length} articles restaurés ✓`);
  } catch (err){ toast('Erreur : ' + err.message); }
  finally { busy(false); }
};

/* ---------- start ---------- */
(async () => {
  try { await loadAll(); } catch (e){ toast('Stockage indisponible : ' + e.message); }
  render();
  if (navigator.storage && navigator.storage.persist) navigator.storage.persist();   // ask Android not to clear our data
  if ('serviceWorker' in navigator) navigator.serviceWorker.register('sw.js').catch(() => {});
})();
</script>
</body>
