<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<title>Maxi Meubles</title>
<meta name="theme-color" content="#ffffff">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icons/icon-192.png">
<link href="https://fonts.googleapis.com/css2?family=Jost:wght@300;400;500&display=swap" rel="stylesheet">
<style>
:root{--bg:#fff;--ink:#141414;--acc:#ce0964;--mute:#8a8580;--line:#ececea;--soft:#f6f5f3;color-scheme:light}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;-webkit-user-select:none;user-select:none}
input{-webkit-user-select:text;user-select:text}
body{margin:0;background:var(--bg);color:var(--ink);font:400 17px/1.5 'Jost',system-ui,sans-serif;-webkit-font-smoothing:antialiased;overscroll-behavior-y:contain}
button,input{font:inherit;color:inherit}
button{background:none;border:0;cursor:pointer;padding:0}
[hidden]{display:none!important}
.wrap{max-width:1400px;margin:0 auto;padding:0 clamp(16px,3.5vw,48px)}

header{position:sticky;top:0;z-index:20;background:rgba(255,255,255,.94);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);border-bottom:1px solid var(--line)}
.bar{display:flex;align-items:center;gap:16px;height:72px}
.brand{height:46px;width:auto;display:block}
@media(max-width:600px){.bar{height:62px}.brand{height:34px}}
.search{margin-left:auto;width:min(320px,42vw);border:1px solid var(--line);border-radius:999px;padding:10px 18px;font-size:16px;outline:none;background:#fff}
.search:focus{border-color:var(--acc)}

.hero{padding:clamp(34px,7vw,90px) 0 clamp(24px,4vw,44px)}
.hero h1{font-weight:300;font-size:clamp(30px,5.5vw,60px);line-height:1.08;margin:0;max-width:16ch}
.hero h1::after{content:"";display:block;width:56px;height:3px;background:var(--acc);margin-top:24px}

.cats{display:flex;gap:10px;overflow-x:auto;scrollbar-width:none;padding:4px 0 24px;position:sticky;top:72px;background:var(--bg);z-index:10}
@media(max-width:600px){.cats{top:62px}}
.cats::-webkit-scrollbar{display:none}
.cats button{flex:0 0 auto;padding:11px 22px;border:1px solid var(--line);border-radius:999px;font-size:16px;color:var(--mute);white-space:nowrap}
.cats button[aria-pressed="true"]{background:var(--acc);border-color:var(--acc);color:#fff}

.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:36px 24px;padding-bottom:100px}
@media(max-width:600px){.grid{grid-template-columns:1fr 1fr;gap:24px 12px}}
.card{text-align:left;display:block;width:100%}
.ph{aspect-ratio:4/5;background:var(--soft);overflow:hidden;position:relative}
.ph img{width:100%;height:100%;object-fit:cover;display:block}
.tag{position:absolute;top:10px;left:10px;background:#fff;color:var(--acc);font-weight:500;font-size:11px;letter-spacing:.12em;text-transform:uppercase;padding:4px 9px}
.tag.promo{background:var(--acc);color:#fff}
.meta{display:flex;justify-content:space-between;gap:10px;margin-top:12px;align-items:baseline}
.meta .n{font-size:16px}
.meta .c{font-size:12px;color:var(--mute);letter-spacing:.06em;text-transform:uppercase;margin-top:2px}
@media(max-width:600px){.meta{flex-direction:column;gap:2px}.meta .n{font-size:15px}}
.price{white-space:nowrap}
.price.promo{color:var(--acc)}
.price s{color:var(--mute);font-size:.85em;margin-right:6px}
.empty{grid-column:1/-1;color:var(--mute);padding:70px 0;text-align:center}

dialog{border:0;padding:0;margin:0;width:100%;max-width:100%;height:100%;max-height:100%;background:var(--bg);color:var(--ink)}
dialog::backdrop{background:rgba(0,0,0,.35)}
dialog[open]{animation:in .22s ease}
@keyframes in{from{opacity:0;transform:translateY(10px)}}
.close{position:fixed;top:calc(16px + env(safe-area-inset-top));right:16px;z-index:5;width:52px;height:52px;border-radius:50%;background:#fff;box-shadow:0 2px 14px rgba(0,0,0,.1);font-size:26px;display:grid;place-items:center}
.sheet{display:grid;grid-template-columns:1.25fr 1fr;height:100%}
@media(orientation:portrait),(max-width:700px){.sheet{grid-template-columns:1fr;grid-template-rows:60% 1fr}}
.gal{position:relative;background:var(--soft);min-height:0;overflow:hidden}
.track{display:flex;overflow-x:auto;scroll-snap-type:x mandatory;height:100%;scrollbar-width:none}
.track::-webkit-scrollbar{display:none}
.track img{flex:0 0 100%;width:100%;height:100%;object-fit:cover;scroll-snap-align:center}
.dots{position:absolute;bottom:18px;left:0;right:0;display:flex;justify-content:center;gap:8px}
.dots i{width:8px;height:8px;border-radius:50%;background:rgba(255,255,255,.55);box-shadow:0 0 3px rgba(0,0,0,.2)}
.dots i.on{background:#fff}
.arr{position:absolute;top:50%;transform:translateY(-50%);width:52px;height:52px;border-radius:50%;background:rgba(255,255,255,.88);display:grid;place-items:center;font-size:24px}
.arr.l{left:16px}.arr.r{right:16px}
.det{padding:clamp(24px,4.5vw,64px);display:flex;flex-direction:column;gap:16px;overflow-y:auto}
.det .c{font-size:13px;color:var(--acc);letter-spacing:.16em;text-transform:uppercase}
.det h2{font-weight:300;font-size:clamp(28px,4vw,44px);line-height:1.1;margin:0}
.det .price{font-size:26px}
.det .d{color:#4a4743;white-space:pre-line;margin:0;font-size:18px}
.attrs{display:flex;flex-wrap:wrap;gap:8px}
.attrs span{font-size:14px;border:1px solid var(--line);padding:6px 14px;border-radius:999px;color:var(--mute)}
</style>
</head>
<body>
<header>
  <div class="wrap bar">
    <img class="brand" id="brand" src="icons/logo.png" alt="Maxi Meubles">
    <input class="search" id="q" type="search" placeholder="Rechercher" autocomplete="off">
  </div>
</header>

<main class="wrap">
  <section class="hero"><h1 id="tagline"></h1></section>
  <div class="cats" id="cats"></div>
  <div class="grid" id="grid"></div>
</main>

<dialog id="sheet">
  <button class="close" id="close" aria-label="Fermer">×</button>
  <div class="sheet">
    <div class="gal">
      <div class="track" id="track"></div>
      <button class="arr l" id="prev" aria-label="Photo précédente">‹</button>
      <button class="arr r" id="next" aria-label="Photo suivante">›</button>
      <div class="dots" id="dots"></div>
    </div>
    <div class="det" id="det"></div>
  </div>
</dialog>

<script>
const $ = s => document.querySelector(s);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const euro = v => { const n = Number(String(v ?? '').replace(',', '.')); return String(v ?? '').trim() !== '' && isFinite(n) ? n.toLocaleString('fr-FR', Number.isInteger(n) ? {} : {minimumFractionDigits: 2, maximumFractionDigits: 2}) + ' €' : ''; };

let data = {items: [], cats: [], name: 'Maxi Meubles', tagline: ''}, raw = '', cat = 'Tout';
const photos = it => it.photos && it.photos.length ? it.photos : (it.img ? [it.img] : []);
const priceHTML = it => { const p = euro(it.price), o = euro(it.oldPrice); return p ? (o ? `<s>${o}</s>` : '') + p : ''; };

function render(){
  document.title = data.name || 'Maxi Meubles'; $('#brand').alt = document.title;
  $('#tagline').textContent = data.tagline || '';
  const vis = data.items.filter(i => !i.hidden), used = new Set(vis.map(i => i.cat));
  const list = ['Tout', ...(data.cats || []).filter(c => used.has(c))];
  if (!list.includes(cat)) cat = 'Tout';
  $('#cats').innerHTML = list.map(c => `<button aria-pressed="${c === cat}" data-c="${esc(c)}">${esc(c)}</button>`).join('');
  const q = $('#q').value.trim().toLowerCase();
  const arr = vis.filter(it => (cat === 'Tout' || it.cat === cat) && (!q || (it.name + ' ' + (it.desc || '') + ' ' + it.cat).toLowerCase().includes(q)));
  $('#grid').innerHTML = arr.length ? arr.map(it => {
    const ph = photos(it)[0];
    return `<button class="card" data-id="${esc(it.id)}">
      <div class="ph">${ph ? `<img loading="lazy" src="${esc(ph)}" alt="">` : ''}
        ${it.oldPrice ? '<span class="tag promo">Promo</span>' : it.isNew ? '<span class="tag">Nouveau</span>' : ''}</div>
      <div class="meta"><div><div class="n">${esc(it.name)}</div><div class="c">${esc(it.cat)}</div></div>
        <div class="price${it.oldPrice ? ' promo' : ''}">${priceHTML(it)}</div></div></button>`;
  }).join('') : `<p class="empty">${data.items.length ? 'Aucun article ici.' : 'Chargement du catalogue…'}</p>`;
}
$('#cats').onclick = e => { const b = e.target.closest('button'); if (!b) return; cat = b.dataset.c; render(); window.scrollTo({top: $('.hero').offsetHeight}); };
$('#q').oninput = render;
$('#grid').onclick = e => { const b = e.target.closest('.card'); if (b) openSheet(b.dataset.id); };

let cur = null, idx = 0;
function openSheet(id){
  const it = data.items.find(i => i.id === id); if (!it) return;
  cur = it; idx = 0;
  const ph = photos(it);
  $('#track').innerHTML = ph.map(u => `<img src="${esc(u)}" alt="">`).join('');
  $('#dots').innerHTML = ph.length > 1 ? ph.map((_, i) => `<i class="${i ? '' : 'on'}"></i>`).join('') : '';
  $('#prev').hidden = $('#next').hidden = ph.length < 2;
  const attrs = Object.values(it.attrs || {}).filter(Boolean);
  $('#det').innerHTML = `<div class="c">${esc(it.cat)}</div><h2>${esc(it.name)}</h2>
    <div class="price${it.oldPrice ? ' promo' : ''}">${priceHTML(it)}</div>
    ${it.desc ? `<p class="d">${esc(it.desc)}</p>` : ''}
    ${attrs.length ? `<div class="attrs">${attrs.map(a => `<span>${esc(a)}</span>`).join('')}</div>` : ''}`;
  $('#sheet').showModal(); $('#track').scrollLeft = 0;
}
function go(i){ const t = $('#track'); t.scrollTo({left: i * t.clientWidth, behavior: 'smooth'}); }
$('#track').addEventListener('scroll', () => { const t = $('#track'), i = Math.round(t.scrollLeft / t.clientWidth);
  if (i !== idx){ idx = i; [...$('#dots').children].forEach((d, k) => d.classList.toggle('on', k === i)); } }, {passive: true});
$('#prev').onclick = () => go(Math.max(0, idx - 1));
$('#next').onclick = () => go(Math.min(photos(cur).length - 1, idx + 1));
$('#close').onclick = () => $('#sheet').close();

/* back to the start after 2 min without touch */
let idleT;
function idle(){ clearTimeout(idleT); idleT = setTimeout(() => {
  if ($('#sheet').open) $('#sheet').close();
  $('#q').value = ''; cat = 'Tout'; render(); window.scrollTo({top: 0});
}, 120000); }
['pointerdown', 'scroll', 'keydown'].forEach(ev => addEventListener(ev, idle, {passive: true, capture: true})); idle();

/* load the catalogue: from internet when available, otherwise the copy saved on the device */
async function refresh(){
  try {
    const r = await fetch('catalogue.json?v=' + Date.now(), {cache: 'no-store'});
    if (!r.ok) throw 0;
    const txt = await r.text();
    if (txt === raw) return;
    raw = txt; data = JSON.parse(txt); data.items ||= [];
    localStorage.setItem('mm-catalogue', txt);
    if (!$('#sheet').open) render();
    preload();
  } catch (_) {}
}
// download every photo once so they are all available without internet
let preloading = false;
async function preload(){
  if (preloading || !navigator.serviceWorker?.controller) return; preloading = true;
  for (const it of data.items) for (const u of photos(it)){ try { await fetch(u); } catch (_) { break; } }
  preloading = false;
}
(function start(){
  const saved = localStorage.getItem('mm-catalogue');
  if (saved){ try { raw = saved; data = JSON.parse(saved); } catch (_) {} }
  render(); refresh();
  setInterval(() => { if (!$('#sheet').open) refresh(); }, 5 * 60 * 1000);
  document.addEventListener('visibilitychange', () => { if (!document.hidden) refresh(); });
  if ('serviceWorker' in navigator){
    navigator.serviceWorker.register('sw.js').catch(() => {});
    navigator.serviceWorker.addEventListener('controllerchange', preload);
  }
})();
</script>
</body>
</html>
